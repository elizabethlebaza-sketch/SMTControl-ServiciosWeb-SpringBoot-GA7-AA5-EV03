spring.application.name=loginapi-aa5-ev01

# Conexion TiDB Cloud
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/smtcontrol?sslMode=VERIFY_CA&serverSslCert=classpath:certificados/isrgrootx1.pem
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true